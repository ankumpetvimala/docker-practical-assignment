services:

  web:
    build: .
    container_name: docker-web
    ports:
      - "8083:80"
    volumes:
      - web-data:/usr/share/nginx/html
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: docker-redis
    networks:
      - app-network

volumes:
  web-data:

networks:
  app-network:
    driver: bridge